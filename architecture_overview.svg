<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .h{font-size:22px;font-weight:700;fill:#0f172a}
      .t{font-size:16px;font-weight:700;fill:#0f172a}
      .s{font-size:14px;fill:#334155}
      .m{font-size:13px;fill:#475569}
      .ln{stroke:#334155;stroke-width:2.2;fill:none}
      .box{fill:#ffffff;stroke:#94a3b8;stroke-width:1.2}
    </style>
  </defs>
  <rect width="1600" height="820" fill="#ffffff"/>

  <text x="800" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">NeuroFlow AI — Architecture Overview</text>
  <text x="800" y="78" text-anchor="middle" class="s">Stroke-history screening from self-reported survey answers · not a diagnosis</text>

  <!-- USER -->
  <rect x="40" y="330" width="180" height="130" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.8"/>
  <text x="130" y="380" text-anchor="middle" class="h">User</text>
  <text x="130" y="408" text-anchor="middle" class="m">answers 21 survey</text>
  <text x="130" y="426" text-anchor="middle" class="m">questions</text>
  <line x1="220" y1="395" x2="286" y2="395" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- WEB APP -->
  <rect x="290" y="150" width="280" height="490" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="430" y="188" text-anchor="middle" class="h">Web Application</text>
  <text x="430" y="212" text-anchor="middle" class="m">(React frontend)</text>

  <rect x="310" y="235" width="240" height="105" rx="10" class="box"/>
  <text x="430" y="265" text-anchor="middle" class="t">Questionnaire</text>
  <text x="430" y="290" text-anchor="middle" class="m">3 steps · input checks</text>
  <text x="430" y="310" text-anchor="middle" class="m">BMI from height + weight</text>

  <rect x="310" y="355" width="240" height="125" rx="10" class="box"/>
  <text x="430" y="385" text-anchor="middle" class="t">Results Page</text>
  <text x="430" y="410" text-anchor="middle" class="m">screening score + flag</text>
  <text x="430" y="430" text-anchor="middle" class="m">"what distinguishes</text>
  <text x="430" y="448" text-anchor="middle" class="m">this profile" bars</text>
  <text x="430" y="466" text-anchor="middle" class="m">causal diagram</text>

  <rect x="310" y="495" width="240" height="85" rx="10" class="box"/>
  <text x="430" y="527" text-anchor="middle" class="t">Drift Dashboard</text>
  <text x="430" y="552" text-anchor="middle" class="m">is live data shifting?</text>

  <text x="430" y="615" text-anchor="middle" class="m">disclaimer footer on every page</text>

  <!-- APP <-> BACKEND -->
  <line x1="570" y1="300" x2="656" y2="300" class="ln" marker-end="url(#a)"/>
  <text x="613" y="288" text-anchor="middle" class="m">answers</text>
  <line x1="656" y1="420" x2="572" y2="420" class="ln" marker-end="url(#a)"/>
  <text x="613" y="408" text-anchor="middle" class="m">result</text>
  <line x1="656" y1="540" x2="572" y2="540" class="ln" marker-end="url(#a)"/>
  <text x="613" y="528" text-anchor="middle" class="m">drift</text>

  <!-- BACKEND -->
  <rect x="660" y="110" width="480" height="640" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="900" y="146" text-anchor="middle" class="h">Backend Server</text>
  <text x="900" y="170" text-anchor="middle" class="m">(Python FastAPI)</text>

  <rect x="685" y="190" width="430" height="70" rx="10" class="box"/>
  <text x="900" y="220" text-anchor="middle" class="t">Input Validation</text>
  <text x="900" y="243" text-anchor="middle" class="m">every answer checked against the model's valid ranges</text>
  <line x1="900" y1="260" x2="900" y2="283" class="ln" marker-end="url(#a)"/>

  <!-- ML ENGINE -->
  <rect x="685" y="285" width="430" height="200" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.2"/>
  <text x="900" y="315" text-anchor="middle" class="t">ML Prediction Engine (Model B)</text>

  <rect x="700" y="335" width="92" height="80" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="746" y="368" text-anchor="middle" class="t" font-size="14">Prepare</text>
  <text x="746" y="390" text-anchor="middle" class="m">order +</text>
  <text x="746" y="406" text-anchor="middle" class="m">encode</text>
  <rect x="806" y="335" width="92" height="80" rx="8" fill="#bbf7d0" stroke="#15803d" stroke-width="1.8"/>
  <text x="852" y="368" text-anchor="middle" class="t" font-size="14">XGBoost</text>
  <text x="852" y="390" text-anchor="middle" class="m">boosted</text>
  <text x="852" y="406" text-anchor="middle" class="m">trees</text>
  <rect x="912" y="335" width="92" height="80" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="958" y="368" text-anchor="middle" class="t" font-size="14">Calibrate</text>
  <text x="958" y="390" text-anchor="middle" class="m">true</text>
  <text x="958" y="406" text-anchor="middle" class="m">probability</text>
  <rect x="1018" y="335" width="84" height="80" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1060" y="368" text-anchor="middle" class="t" font-size="14">Threshold</text>
  <text x="1060" y="390" text-anchor="middle" class="m">flag if</text>
  <text x="1060" y="406" text-anchor="middle" class="m">≥ 2.8%</text>
  <line x1="792" y1="375" x2="804" y2="375" class="ln" marker-end="url(#a)"/>
  <line x1="898" y1="375" x2="910" y2="375" class="ln" marker-end="url(#a)"/>
  <line x1="1004" y1="375" x2="1016" y2="375" class="ln" marker-end="url(#a)"/>
  <text x="900" y="448" text-anchor="middle" class="m">output: screening score (%) + Flagged / Not flagged</text>
  <text x="900" y="469" text-anchor="middle" class="m">catches ~86% of stroke-history cases</text>
  <line x1="900" y1="485" x2="900" y2="508" class="ln" marker-end="url(#a)"/>

  <rect x="685" y="510" width="430" height="95" rx="10" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="900" y="550" text-anchor="middle" class="t">Explainability (SHAP)</text>
  <text x="900" y="576" text-anchor="middle" class="m">top 5 answers that push this score up or down</text>

  <rect x="685" y="620" width="430" height="105" rx="10" class="box"/>
  <text x="900" y="650" text-anchor="middle" class="t">Drift Monitor (PSI)</text>
  <text x="900" y="674" text-anchor="middle" class="m">compares stored answers with the training data</text>
  <text x="900" y="694" text-anchor="middle" class="m">stable · moderate · significant</text>

  <!-- RIGHT COLUMN -->
  <rect x="1220" y="110" width="340" height="150" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="1390" y="145" text-anchor="middle" class="t">Offline Training</text>
  <text x="1390" y="172" text-anchor="middle" class="m">CDC BRFSS survey · 2.17M people</text>
  <text x="1390" y="194" text-anchor="middle" class="m">train 2015–19 · validate 2021</text>
  <text x="1390" y="216" text-anchor="middle" class="m">test 2023</text>
  <text x="1390" y="240" text-anchor="middle" class="m">Model A (28) vs Model B (21)</text>
  <line x1="1390" y1="260" x2="1390" y2="296" class="ln" marker-end="url(#a)"/>

  <rect x="1220" y="298" width="340" height="150" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="1390" y="335" text-anchor="middle" class="t">Saved Trained Model</text>
  <text x="1390" y="362" text-anchor="middle" class="m">preprocessor · XGBoost · calibrator</text>
  <text x="1390" y="384" text-anchor="middle" class="m">threshold · valid input ranges</text>
  <text x="1390" y="406" text-anchor="middle" class="m">training distribution</text>
  <text x="1390" y="430" text-anchor="middle" class="m">frozen — never retrained live</text>
  <line x1="1218" y1="373" x2="1117" y2="373" class="ln" marker-end="url(#a)"/>
  <text x="1168" y="362" text-anchor="middle" class="m">loads</text>

  <rect x="1220" y="540" width="340" height="130" rx="14" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="1390" y="575" text-anchor="middle" class="t">Database (PostgreSQL)</text>
  <text x="1390" y="601" text-anchor="middle" class="m">stores answers + results</text>
  <text x="1390" y="623" text-anchor="middle" class="m">no names, emails or IPs</text>
  <text x="1390" y="645" text-anchor="middle" class="m">random ID per assessment</text>
  <line x1="1142" y1="605" x2="1218" y2="605" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>

  <text x="800" y="795" text-anchor="middle" class="m">Solid border = part of the running app · dashed border = offline training · arrows show data flow</text>
</svg>
